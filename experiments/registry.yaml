# Experiment matrix for the PPE-EYE enhancement plan (see ../SCHEDULE.md).
# The loop driver (run.py --next) walks this list in order and runs the first
# experiment that has no result yet and whose deps are all `done`.
#
# Each experiment:
#   id     : unique, used as the run name and results filename
#   week   : 1-6, for grouping in the report
#   tier   : 1-3
#   item   : which list item(s) it covers ("*" = re-scoped)
#   kind   : train | eval | audit | corrupt | crossdata | track | distill | calib | arch
#   desc   : one line, shown in the report
#   deps   : list of experiment ids that must be `done` first ([] = none)
#   params : merged over `defaults`, passed to the handler for `kind`
#
# All declared kinds now have handlers: train / eval / audit / corrupt / calib in
# run.py, and crossdata / arch / distill / track in week6.py.

defaults:
  data: data/data.yaml
  model: yolo11s.pt
  imgsz: 640
  epochs: 150
  patience: 30
  batch: 16
  seed: 0
  device: "0"
  optimizer: AdamW
  lr0: 0.0001          # re-pointed from 1e-3 after the Week-1 LR sweep: low LR won
  cos_lr: true
  warmup_epochs: 3.0
  close_mosaic: 10
  project: runs/ppe_enh

# The base recipe the Week-1 resolution / augmentation arms build on.
# = defaults above (AdamW 1e-4, cosine, warmup 3, close_mosaic 10, 150 ep, patience 30).
# NOTE: ids w1_{n,m}_adamw_1e3 are legacy labels — they now inherit AdamW 1e-4 too,
# so the n/s/m size comparison stays on one recipe. The `deps: [w1_s_adamw_1e3]`
# gates are satisfied (that run is done); Week-2+ handlers select the best Week-1
# run by metric, not by id.

experiments:

  # ---------- Week 1 : training hygiene ----------
  - id: w1_s_baseline_repro
    week: 1
    tier: 1
    item: "2"
    kind: train
    desc: "Paper's lr0=1e-5 NAdam cell on our split - expected to barely move off COCO init"
    deps: []
    params: {optimizer: NAdam, lr0: 1.0e-5, momentum: 0.937, epochs: 100, warmup_epochs: 0.0, close_mosaic: 0}

  - id: w1_s_sgd_1e2
    week: 1
    tier: 1
    item: "2"
    kind: train
    desc: "SGD lr0=1e-2, cosine, warmup 3, close_mosaic 10"
    deps: []
    params: {optimizer: SGD, lr0: 0.01, momentum: 0.937}

  - id: w1_s_adamw_1e3
    week: 1
    tier: 1
    item: "2"
    kind: train
    desc: "AdamW lr0=1e-3, cosine - the expected LR winner and base recipe for later arms"
    deps: []
    params: {optimizer: AdamW, lr0: 0.001}

  - id: w1_s_adamw_1e4
    week: 1
    tier: 1
    item: "2"
    kind: train
    desc: "AdamW lr0=1e-4, cosine"
    deps: []
    params: {optimizer: AdamW, lr0: 0.0001}

  - id: w1_s_res_960
    week: 1
    tier: 1
    item: "3"
    kind: train
    desc: "Base recipe at imgsz=960 - small-object resolution sweep"
    deps: [w1_s_adamw_1e3]
    params: {imgsz: 960, batch: 12}

  - id: w1_s_res_1280
    week: 1
    tier: 1
    item: "3"
    kind: train
    desc: "Base recipe at imgsz=1280 - small-object resolution sweep"
    deps: [w1_s_adamw_1e3]
    params: {imgsz: 1280, batch: 8}

  - id: w1_s_noaug
    week: 1
    tier: 1
    item: "5"
    kind: train
    desc: "Base recipe, all online augmentation OFF - the control arm for item #5"
    deps: [w1_s_adamw_1e3]
    params:
      hsv_h: 0.0
      hsv_s: 0.0
      hsv_v: 0.0
      degrees: 0.0
      translate: 0.0
      scale: 0.0
      shear: 0.0
      perspective: 0.0
      flipud: 0.0
      fliplr: 0.0
      mosaic: 0.0
      mixup: 0.0
      copy_paste: 0.0
      erasing: 0.0

  - id: w1_s_domainaug
    week: 1
    tier: 1
    item: "5"
    kind: train
    desc: "Base recipe + strong HSV-V (glare), scale (distance), erasing (occlusion)"
    deps: [w1_s_adamw_1e3]
    params:
      hsv_v: 0.7
      hsv_s: 0.5
      scale: 0.7
      translate: 0.15
      erasing: 0.5
      mosaic: 1.0
      mixup: 0.1

  - id: w1_s_imbalance
    week: 1
    tier: 1
    item: "*"
    kind: train
    desc: "Base recipe + copy_paste + mixup to lift thin classes WHV (48) / WV (36)"
    deps: [w1_s_adamw_1e3]
    params: {copy_paste: 0.5, mixup: 0.15}

  - id: w1_n_adamw_1e3
    week: 1
    tier: 1
    item: "3"
    kind: train
    desc: "yolo11n base recipe - deployable size point for the 8-camera budget"
    deps: []
    params: {model: yolo11n.pt, batch: 32}

  - id: w1_m_adamw_1e3
    week: 1
    tier: 1
    item: "3"
    kind: train
    desc: "yolo11m base recipe - upper size point, KD teacher candidate"
    deps: []
    params: {model: yolo11m.pt, batch: 12}

  # ---------- Week 2 : data quality + honest evaluation ----------
  - id: w2_honest_eval
    week: 2
    tier: 1
    item: "6"
    kind: eval
    desc: "Person-level verdicts on the best Week-1 checkpoint: violation recall, false-alarm, undetected persons (strict + helmet rules)"
    deps: []
    params: {eval_kind: honest, weights: runs/ppe_enh/w1_s_adamw_1e4/weights/best.pt}

  - id: w2_label_audit
    week: 2
    tier: 1
    item: "6"
    kind: audit
    desc: "Dataset composition + model-assisted suspicious-box flags (tiny / edge / aspect outliers / high model-GT disagreement) -> review queue + cleaned label set"
    deps: [w2_honest_eval]
    params: {weights: runs/ppe_enh/w1_s_adamw_1e4/weights/best.pt}

  - id: w2_eval_clean_vs_noisy
    week: 2
    tier: 1
    item: "6"
    kind: eval
    desc: "Re-run honest eval on cleaned vs original test - the label-noise premium"
    deps: [w2_label_audit]
    params: {eval_kind: clean_vs_noisy, weights: runs/ppe_enh/w1_s_adamw_1e4/weights/best.pt}

  - id: w2_hard_negatives
    week: 2
    tier: 1
    item: "7"
    kind: train
    desc: "Auto-fetched distractor images as background-only, retrain winner - false-positive mode"
    deps: [w2_honest_eval]
    params: {}

  - id: w2_sahi_upperbound
    week: 2
    tier: 1
    item: "4"
    kind: eval
    desc: "Sliced inference (sahi) on full-res test - distant small-object upper bound"
    deps: [w2_honest_eval]
    params: {eval_kind: sahi, weights: runs/ppe_enh/w1_s_adamw_1e4/weights/best.pt}

  # ---------- Week 3 : corruption benchmark ----------
  - id: w3_corruptions
    week: 3
    tier: 2
    item: "8"
    kind: corrupt
    desc: "Motion blur / defocus / JPEG / low light / overexposure / dust-haze x 5 severities, scored person-level"
    deps: [w1_s_adamw_1e3]
    params:
      severities: 5
      rule: helmet          # strict's false-alarm denominator is 4-9 persons - cannot resolve an effect
      conf_sweep: "0.10,0.25,0.50"
      models:
        w1_baseline: runs/ppe_enh/w1_s_adamw_1e4/weights/best.pt
        w4_mixed: runs/ppe_enh/w4_mixed_train/weights/best.pt

  - id: w3_darkaug
    week: 3
    tier: 2
    item: "8"
    kind: train
    desc: "Mixed recipe + aggressive brightness aug (hsv_v 0.9 -> value gain 0.1-1.9x) to attack the low-light collapse found by w3_corruptions"
    deps: [w3_corruptions]
    params:
      data: data/mixed_pictor_sh17/data.yaml
      hsv_v: 0.9
      also_eval_data: ["sh17=data/sh17_compliance/data.yaml"]

  - id: w3_corrupt_dark
    week: 3
    tier: 2
    item: "8"
    kind: corrupt
    desc: "Re-run the corruption benchmark on the dark-augmented model - does hsv_v=0.9 recover the low-light collapse?"
    deps: [w3_darkaug]
    params:
      severities: 5
      rule: helmet
      conf_sweep: "0.10,0.25,0.50"
      models:
        w3_darkaug: runs/ppe_enh/w3_darkaug/weights/best.pt

  # ---------- Week 4 : generalisation + temporal ----------
  - id: w4_sh17_train
    week: 4
    tier: 2
    item: "9"
    kind: train
    desc: "Train on SH17-compliance ONLY (498 PPE-bearing imgs, mapped to W/WH/WHV/WV), cross-eval on Pictor test"
    deps: []
    params:
      data: data/sh17_compliance/data.yaml
      also_eval_data: ["pictor=data/data.yaml"]

  - id: w4_mixed_train
    week: 4
    tier: 2
    item: "9"
    kind: train
    desc: "Train on Pictor + SH17-compliance combined; val/test stay PURE Pictor so the number is comparable to Weeks 1-2"
    deps: []
    params:
      data: data/mixed_pictor_sh17/data.yaml
      also_eval_data: ["sh17=data/sh17_compliance/data.yaml"]

  - id: w4_crossdata_sh17
    week: 4
    tier: 2
    item: "9"
    kind: crossdata
    desc: "Week-1 Pictor-only model evaluated on SH17-compliance test - the generalisation drop"
    deps: []
    params:
      target: sh17
      weights: runs/ppe_enh/w1_s_adamw_1e4/weights/best.pt
      data: data/sh17_compliance/data_ood.yaml
      rules: [helmet]
      conf_sweep: "0.10,0.20,0.30,0.50"

  - id: w4_crossdata_chv
    week: 4
    tier: 2
    item: "9"
    kind: crossdata
    desc: "Cross-dataset test on CHV after ontology mapping"
    deps: [w1_s_adamw_1e3]
    # CHV is not on this machine and roboflow returns 403 without an API key, so
    # `data` is deliberately unset - the handler raises and the row records why.
    params: {target: chv}

  - id: w4_track_vote
    week: 4
    tier: 2
    item: "10"
    kind: track
    desc: "N-frame confidence-weighted vote over noisy re-observations, N in {1,3,5,7,9} - proxy for Amsar's PPESmoother (no video in repo)"
    deps: [w1_s_adamw_1e3]
    params:
      n_sweep: [1, 3, 5, 7, 9]
      weights: runs/ppe_enh/w4_mixed_train/weights/best.pt
      rule: helmet
      conf_sweep: "0.10,0.20,0.30,0.50"

  # ---------- Week 5 : deployment contributions ----------
  - id: w5_kd_x_to_s
    week: 5
    tier: 2
    item: "11"
    kind: distill
    desc: "yolo11m teacher -> yolo11s student via teacher pseudo-labelling on the mixed train set"
    deps: [w1_m_adamw_1e3, w1_s_adamw_1e3]
    params:
      student: yolo11s.pt
      teacher: runs/ppe_enh/w1_m_adamw_1e3/weights/best.pt
      data: data/mixed_pictor_sh17/data.yaml
      teacher_conf: 0.5

  - id: w5_kd_x_to_n
    week: 5
    tier: 2
    item: "11"
    kind: distill
    desc: "yolo11m teacher -> yolo11n student via teacher pseudo-labelling - the deployable size point"
    deps: [w1_m_adamw_1e3, w1_n_adamw_1e3]
    params:
      student: yolo11n.pt
      teacher: runs/ppe_enh/w1_m_adamw_1e3/weights/best.pt
      data: data/mixed_pictor_sh17/data.yaml
      teacher_conf: 0.5
      batch: 32

  - id: w5_calibration
    week: 5
    tier: 2
    item: "12"
    kind: calib
    desc: "Reliability diagrams + temperature scaling; ECE before/after. T fitted on val, reported on test"
    deps: [w1_s_adamw_1e3]
    params:
      models:
        w1_baseline: runs/ppe_enh/w1_s_adamw_1e4/weights/best.pt
        w4_mixed: runs/ppe_enh/w4_mixed_train/weights/best.pt

  # ---------- Week 6 : architecture (only if headroom) ----------
  - id: w6_p2_head
    week: 6
    tier: 3
    item: "13"
    kind: arch
    desc: "P2/4 detection head for small, distant workers - accuracy gain vs latency cost"
    deps: [w1_s_adamw_1e3]
    params:
      variant: p2
      variants: [none, p2]
      epochs: 80
      patience: 20
      data: data/mixed_pictor_sh17/data.yaml
      scale: s

  - id: w6_attention
    week: 6
    tier: 3
    item: "14"
    kind: arch
    desc: "CBAM / ECA / SE / CoordAtt after each neck output - ablation rows only"
    deps: [w6_p2_head]
    params:
      variant: attention
      variants: [cbam, eca, se, coordatt]
      epochs: 80
      patience: 20
      data: data/mixed_pictor_sh17/data.yaml
      scale: s

  - id: w6_two_stage
    week: 6
    tier: 3
    item: "15"
    kind: arch
    desc: "person detector -> crop -> PPE classifier: latency as a function of worker count, vs the single-pass model"
    deps: []
    params:
      variant: two_stage
      single_weights: runs/ppe_enh/w4_mixed_train/weights/best.pt
      person_model: yolo11n.pt
      worker_counts: [1, 2, 3, 5, 10, 20, 40]

  - id: w6_baselines
    week: 6
    tier: 3
    item: "16"
    kind: arch
    desc: "RT-DETR baseline on the same data and recipe (D-FINE / RTMDet are not in ultralytics 8.4)"
    deps: []
    params:
      variant: baselines
      models: [rtdetr-l.pt]
      data: data/mixed_pictor_sh17/data.yaml
      batch: 8
      epochs: 100

  - id: w6_qat
    week: 6
    tier: 3
    item: "17"
    kind: arch
    desc: "Post-training quantisation: FP32 vs TensorRT FP16 vs TensorRT INT8 vs ONNX - accuracy retention and latency"
    deps: []
    params:
      variant: quant
      weights: runs/ppe_enh/w4_mixed_train/weights/best.pt
      data: data/mixed_pictor_sh17/data.yaml

  # ---------- Week 7 : the final checkpoint ----------
  # Weeks 1-3 and Week 6 both came back flat: neither the recipe nor the
  # architecture is the lever on this problem. Week 4 found the lever is the
  # data. These runs apply that finding - same recipe as the Week-1 winner,
  # better data (see experiments/build_finest.py) - and produce the .pt that
  # ships into Amsar. val/test stay pure Pictor, unchanged since Week 1.

  - id: final_s_base
    week: 7
    tier: 1
    item: "deploy"
    kind: train
    desc: "yolo11s on Pictor + SH17-v2 (bare-head negatives), Week-1 winning recipe, no extra augmentation"
    deps: []
    params:
      data: data/finest/data.yaml
      model: yolo11s.pt
      also_eval_data:
        - "sh17v2=data/sh17c_v2/data.yaml"
        - "closeup=data/sh17c_v2/data_holdout.yaml"

  - id: final_s_thin
    week: 7
    tier: 1
    item: "deploy"
    kind: train
    desc: "Same, plus copy_paste/mixup - the Week-1 thin-class arm, retested now that WHV has 180 train instances instead of 53"
    deps: []
    params:
      data: data/finest/data.yaml
      model: yolo11s.pt
      copy_paste: 0.3
      mixup: 0.1
      also_eval_data:
        - "sh17v2=data/sh17c_v2/data.yaml"
        - "closeup=data/sh17c_v2/data_holdout.yaml"

  - id: final_n_deploy
    week: 7
    tier: 1
    item: "deploy"
    kind: train
    desc: "yolo11n on the same data - the size point Amsar actually deploys (8 cameras, one forward pass)"
    deps: []
    params:
      data: data/finest/data.yaml
      model: yolo11n.pt
      batch: 32
      also_eval_data:
        - "sh17v2=data/sh17c_v2/data.yaml"
        - "closeup=data/sh17c_v2/data_holdout.yaml"

  - id: final_s_scale
    week: 7
    tier: 1
    item: "deploy"
    kind: train
    desc: "Same data, plus scale/translate jitter only - isolates the distance-matching augmentation that w1_s_domainaug bundled with brightness and erasing"
    deps: []
    params:
      data: data/finest/data.yaml
      model: yolo11s.pt
      scale: 0.6
      translate: 0.15
      also_eval_data:
        - "sh17v2=data/sh17c_v2/data.yaml"
        - "closeup=data/sh17c_v2/data_holdout.yaml"

  - id: final_s_mixval
    week: 7
    tier: 1
    item: "deploy"
    kind: train
    desc: "Same data and recipe as final_s_base; only the VAL set changes (Pictor val + SH17-v2 val) so early stopping is not driven by Pictor val's 6.49 persons/img outlier distribution"
    deps: []
    params:
      data: data/finest/data_mixval.yaml
      model: yolo11s.pt
      also_eval_data:
        - "sh17v2=data/sh17c_v2/data.yaml"
        - "closeup=data/sh17c_v2/data_holdout.yaml"

  - id: final_n_mixval
    week: 7
    tier: 1
    item: "deploy"
    kind: train
    desc: "yolo11n on the mixed-val config - the deployable size point, selected on a representative val set"
    deps: []
    params:
      data: data/finest/data_mixval.yaml
      model: yolo11n.pt
      batch: 32
      also_eval_data:
        - "sh17v2=data/sh17c_v2/data.yaml"
        - "closeup=data/sh17c_v2/data_holdout.yaml"
